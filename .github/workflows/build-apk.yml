name: Build Mubasher Sport APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MubasherSportAndroid_beIN.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check ZIP file
        run: |
          ls -la
          test -f MubasherSportAndroid_beIN.zip

      - name: Extract project
        run: |
          unzip -q MubasherSportAndroid_beIN.zip -d extracted
          find extracted -maxdepth 4 -type f | head -100

      - name: Build Android project
        run: |
          PROJECT_DIR="$(dirname "$(find extracted -type f -path '*/app/build.gradle' -print -quit)")"
          test -n "$PROJECT_DIR"
          cd "$PROJECT_DIR/.."
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MubasherSport-debug-apk
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
